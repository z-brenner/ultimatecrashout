name: Public content CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_CONTENT_ONLY: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install WebP validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes webp
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run validate:public

  e2e:
    # Pinned: ubuntu-latest moved to 26.04, where Playwright 1.56 cannot
    # install Chromium. Move this with the next Playwright upgrade.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PUBLIC_CONTENT_ONLY: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e

  windows-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PUBLIC_CONTENT_ONLY: "1"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.19.0
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:public
